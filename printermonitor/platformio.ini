[platformio]
default_envs = d1_mini
src_dir = .

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

; Keep compiling only project sources from the repo root.
build_src_filter =
  +<*.ino>
  +<*.cpp>

; Use SPIFFS because the project stores config in flash FS.
board_build.filesystem = spiffs

; External libraries used by Settings.h.
lib_deps =
  tzapu/WiFiManager @ ^2.0.17
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
